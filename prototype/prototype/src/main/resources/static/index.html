<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý thiết bị</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f3f6fb;
            color: #1f2937;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 24px;
        }
        .page {
            max-width: 1180px;
            margin: 0 auto;
        }
        h1, h2 {
            margin: 0;
        }
        header {
            margin-bottom: 20px;
        }
        .top-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
            margin-bottom: 20px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .form-grid input,
        .form-grid select,
        .search-input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            background: #f8fafc;
            font-size: 0.95rem;
        }
        .form-actions {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        button {
            cursor: pointer;
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            font-weight: 600;
            transition: transform 0.15s ease, background-color 0.15s ease;
        }
        button:hover {
            transform: translateY(-1px);
        }
        .button-primary {
            background: #2563eb;
            color: #ffffff;
        }
        .button-secondary {
            background: #e2e8f0;
            color: #0f172a;
        }
        .button-danger {
            background: #ef4444;
            color: #ffffff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
            min-width: 760px;
        }
        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }
        th {
            background: #f8fafc;
            color: #0f172a;
            font-size: 0.95rem;
        }
        tbody tr:hover {
            background: #f8fafc;
        }
        .actions button {
            margin-right: 8px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <h1>Quản lý máy móc và thiết bị</h1>
            <p style="margin-top: 10px; color: #475569;">Nhóm 10: Website: Machinery Maintenance Process Management</p>
        </header>

        <div class="card top-bar">
            <input id="search" class="search-input" type="text" placeholder="Tìm kiếm theo tên hoặc mã số">
            <div style="display:flex; gap: 12px; flex-wrap: wrap;">
                <button class="button-secondary" onclick="load()">Hiển thị tất cả</button>
                <button class="button-primary" onclick="searchThietBi()">Tìm kiếm</button>
            </div>
        </div>

        <div class="card">
            <h2>Thêm thiết bị mới</h2>
            <div class="form-grid">
                <input type="text" id="ten" placeholder="Tên thiết bị">
                <input type="text" id="ma" placeholder="Mã số quản lý">
                <input type="text" id="serial" placeholder="Số serial">
                <input type="text" id="model" placeholder="Model thiết bị">
                <input type="text" id="nhaSanXuat" placeholder="Nhà sản xuất">
                <input type="number" id="namSanXuat" placeholder="Năm sản xuất">
                <select id="trangThai">
                    <option value="Đang hoạt động">Đang hoạt động</option>
                    <option value="Sự cố">Sự cố</option>
                    <option value="Bảo dưỡng">Bảo dưỡng</option>
                </select>
            </div>
            <div class="form-actions">
                <button class="button-primary" onclick="addThietBi()">Lưu thiết bị</button>
            </div>
        </div>

        <div id="editForm" class="card hidden">
            <h2>Chỉnh sửa thiết bị</h2>
            <input type="hidden" id="editId">
            <div class="form-grid">
                <input type="text" id="editTen" placeholder="Tên thiết bị">
                <input type="text" id="editMa" placeholder="Mã số quản lý">
                <input type="text" id="editSerial" placeholder="Số serial">
                <input type="text" id="editModel" placeholder="Model thiết bị">
                <input type="text" id="editNhaSanXuat" placeholder="Nhà sản xuất">
                <input type="number" id="editNamSanXuat" placeholder="Năm sản xuất">
                <select id="editTrangThai">
                    <option value="Đang hoạt động">Đang hoạt động</option>
                    <option value="Sự cố">Sự cố</option>
                    <option value="Bảo dưỡng">Bảo dưỡng</option>
                </select>
            </div>
            <div class="form-actions">
                <button class="button-primary" onclick="updateThietBi()">Cập nhật</button>
                <button class="button-secondary" onclick="cancelEdit()">Hủy</button>
            </div>
        </div>

        <div class="card">
            <h2>Danh sách thiết bị</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Tên</th>
                            <th>Mã số</th>
                            <th>Serial</th>
                            <th>Model</th>
                            <th>Nhà SX</th>
                            <th>Năm SX</th>
                            <th>Trạng thái</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="bangThietBi"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function load() {
            const res = await fetch('/api/thietbi');
            const data = await res.json();
            renderTable(data);
        }

        function renderTable(data) {
            document.getElementById('bangThietBi').innerHTML = data.map(tb =>
                `<tr>
                    <td>${tb.tenThietBi || ''}</td>
                    <td>${tb.maSoQuanLy || ''}</td>
                    <td>${tb.soSerial || ''}</td>
                    <td>${tb.modelType || ''}</td>
                    <td>${tb.nhaSanXuat || ''}</td>
                    <td>${tb.namSanXuat || ''}</td>
                    <td>${tb.trangThaiVanHanh || ''}</td>
                    <td class="actions">
                        <button class="button-secondary" onclick="editThietBi('${tb.idThietBi}')">Sửa</button>
                        <button class="button-danger" onclick="deleteThietBi('${tb.idThietBi}')">Xóa</button>
                    </td>
                </tr>`
            ).join('');
        }

        async function searchThietBi() {
            const keyword = document.getElementById('search').value;
            if (keyword.trim() === '') {
                load();
                return;
            }
            const res = await fetch(`/api/thietbi/search?keyword=${encodeURIComponent(keyword)}`);
            const data = await res.json();
            renderTable(data);
        }

        async function addThietBi() {
            await fetch('/api/thietbi', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    tenThietBi: document.getElementById('ten').value,
                    maSoQuanLy: document.getElementById('ma').value,
                    soSerial: document.getElementById('serial').value,
                    modelType: document.getElementById('model').value,
                    nhaSanXuat: document.getElementById('nhaSanXuat').value,
                    namSanXuat: parseInt(document.getElementById('namSanXuat').value) || null,
                    trangThaiVanHanh: document.getElementById('trangThai').value
                })
            });
            load();
        }

        async function editThietBi(id) {
            const res = await fetch(`/api/thietbi/${id}`);
            const tb = await res.json();
            document.getElementById('editId').value = tb.idThietBi;
            document.getElementById('editTen').value = tb.tenThietBi || '';
            document.getElementById('editMa').value = tb.maSoQuanLy || '';
            document.getElementById('editSerial').value = tb.soSerial || '';
            document.getElementById('editModel').value = tb.modelType || '';
            document.getElementById('editNhaSanXuat').value = tb.nhaSanXuat || '';
            document.getElementById('editNamSanXuat').value = tb.namSanXuat || '';
            document.getElementById('editTrangThai').value = tb.trangThaiVanHanh || '';
            document.getElementById('editForm').classList.remove('hidden');
        }

        async function updateThietBi() {
            const id = document.getElementById('editId').value;
            await fetch(`/api/thietbi/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    tenThietBi: document.getElementById('editTen').value,
                    maSoQuanLy: document.getElementById('editMa').value,
                    soSerial: document.getElementById('editSerial').value,
                    modelType: document.getElementById('editModel').value,
                    nhaSanXuat: document.getElementById('editNhaSanXuat').value,
                    namSanXuat: parseInt(document.getElementById('editNamSanXuat').value) || null,
                    trangThaiVanHanh: document.getElementById('editTrangThai').value
                })
            });
            document.getElementById('editForm').classList.add('hidden');
            load();
        }

        function cancelEdit() {
            document.getElementById('editForm').classList.add('hidden');
        }

        async function deleteThietBi(id) {
            await fetch(`/api/thietbi/${id}`, {
                method: 'DELETE'
            });
            load();
        }

        load();
    </script>
</body>
</html>
