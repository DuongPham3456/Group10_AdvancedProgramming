<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        body { background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .login-box { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.1); width: 100%; max-width: 400px; }
        .login-box h1 { text-align: center; color: #8b3a8f; margin: 0 0 4px; font-size: 1.4rem; }
        .login-box .subtitle { text-align: center; color: #888; margin: 0 0 28px; font-size: .9rem; }
        .msg { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: .9rem; display: none; }
        .msg.error   { background: #fee2e2; color: #c33; border: 1px solid #fca5a5; }
        .msg.success { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
        .demo { margin-top: 16px; font-size: .78rem; color: #999; text-align: center; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Quản lý Bảo trì Thiết bị</h1>
        <p class="subtitle">Tín Thành Environment Technology</p>
        <div id="msg" class="msg"></div>
        <form method="post" action="/login">
            <div class="form-group">
                <label>Tên đăng nhập</label>
                <input type="text" name="username" required placeholder="Nhập tên đăng nhập" autofocus>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" name="password" required placeholder="Nhập mật khẩu">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">Đăng nhập</button>
        </form>
        <p class="demo">
            Tài khoản demo (mật khẩu: <strong>123456</strong>):<br>
            giamdoc · admin.tram · bp.qltb · congnhan
        </p>
    </div>
    <script>
        const p = new URLSearchParams(location.search);
        const el = document.getElementById('msg');
        if (p.has('error'))  { el.textContent = 'Tên đăng nhập hoặc mật khẩu không đúng.'; el.className = 'msg error';   el.style.display = 'block'; }
        if (p.has('logout')) { el.textContent = 'Đã đăng xuất thành công.';                 el.className = 'msg success'; el.style.display = 'block'; }
    </script>
</body>
</html>
